# Set NODALWIRE_ADMIN_TOKEN explicitly before starting; no token is generated.
# Declared networks are open by default. Membership names are not identities.
config_version = 2
endpoint = "tcp://127.0.0.1:5555"
lease_seconds = 10.0
send_hwm = 64
receive_hwm = 64
max_payload_bytes = 1048576

# Cooperative name policy, not authentication (remove for open admission):
allowed_names = ["alice", "bob", "observer"]

# Directional routing denies; unspecified routes are permitted.
# Exact names, @static-routing-group selectors and * are supported.
deny = [["@writers", "observer"]]

[routing_groups]
writers = ["alice", "bob"]

[networks.writers]
# Open network; peers must still explicitly join it.
