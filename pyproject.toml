[project]
name = "nodalwire"
version = "0.2.0"
description = "A bounded native ZeroMQ byte relay for trusted local Python applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.11.1,<5",
    "pyzmq>=27.1.0",
]

[project.urls]
Repository = "https://github.com/keenlycode/nodalwire"
Issues = "https://github.com/keenlycode/nodalwire/issues"

[project.scripts]
nodalwire = "nodalwire.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1",
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nodalwire"
source-exclude = ["**/__pycache__/**", "src/nodalwire/client/node"]
wheel-exclude = ["nodalwire/client/node"]

[tool.ruff]
extend-exclude = ["src/nodalwire/client/node"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Core environment only; docs Python's six unit + three integration cases run
# in its separate locked environment via pnpm --dir src/tools/docs verify.
testpaths = ["tests/unit/nodalwire", "tests/integration/*_test.py", "tests/usage"]
addopts = ["--import-mode=importlib"]
